name: cuatro_retos
description: Los cuatro retos de consumo de APIs en Flutter - peliculas, gatos, clima y criptomonedas.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

# Si "flutter pub get" se queja de una versión, borra la línea y ejecuta:
#   flutter pub add http geolocator
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
